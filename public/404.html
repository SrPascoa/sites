<!doctype html>
<!--
  Com este ficheiro, o Cloudflare Pages responde 404 a URLs que não existem
  (sem ele, devolvia a home com 200 — "soft 404" para o Google). O site é de
  página única: as secções são âncoras da home, não rotas.
-->
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#030303" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Página não encontrada | Brivon Sites</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #030303; color: #f4f4f5;
             font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 1.5rem; box-sizing: border-box; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 1.75rem; margin: 1.25rem 0 .5rem; }
      p { color: #a1a1aa; margin: 0 0 1.75rem; }
      a { display: inline-block; background: #f2711c; color: #fff; text-decoration: none; font-weight: 600;
          padding: .8rem 1.5rem; border-radius: .75rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="" />
      <h1>Página não encontrada</h1>
      <p>O endereço que abriu não existe.</p>
      <a href="/">Voltar ao início</a>
    </main>
  </body>
</html>
