<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <!-- O logótipo da marca. O favicon.svg do template continua em public/ mas
         já não é usado. -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030303" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Título, descrição, canónico, Open Graph, X e JSON-LD: gerados a partir
         de src/config/seo.ts pelo plugin em scripts/seo-plugin.ts. -->
    <!--seo:head-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>body{background:#030303;color:#f4f4f5}@keyframes seo-fallback-in{to{opacity:1}}.seo-fallback{opacity:0;animation:seo-fallback-in .3s 4s forwards}</style>
  </head>
  <body>
    <!-- Resumo estático para robôs sem JavaScript; o React substitui-o ao arrancar. -->
    <div id="root"><!--seo:fallback--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
